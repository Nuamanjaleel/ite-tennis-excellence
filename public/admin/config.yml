backend:
  name: github
  repo: Nuamanjaleel/ite-tennis-excellence
  branch: main
  base_url: https://ite-tennis-excellence.vercel.app
  auth_endpoint: api/auth

media_folder: public
public_folder: ""

collections:
  - name: event
    label: "Event Settings"
    files:
      - name: event
        label: "Event Details"
        file: src/content/event.json
        format: json
        fields:
          - {
              label: "Edition name (e.g. Edition 02)",
              name: edition,
              widget: string,
            }
          - {
              label: "First day and start time (drives the countdown and all dates shown)",
              name: start,
              widget: datetime,
            }
          - {
              label: "Last day (leave empty for a one day event)",
              name: end,
              widget: datetime,
              required: false,
            }
          - { label: "Venue", name: venue, widget: string }
          - {
              label: "Knockouts Start Time (e.g. 9:00 AM)",
              name: knockoutsAt,
              widget: string,
            }
          - {
              label: "Rule Book PDF",
              name: ruleBook,
              widget: file,
              media_library: { config: { multiple: false } },
            }

  - name: categories
    label: "Participants & Categories"
    files:
      - name: categories
        label: "Categories"
        file: src/content/categories.json
        format: json
        fields:
          - name: items
            label: Categories
            widget: list
            fields:
              - {
                  label: "ID (optional, leave blank)",
                  name: id,
                  widget: string,
                  required: false,
                }
              - { label: "Category Name", name: label, widget: string }
              - name: players
                label: Players
                widget: list
                field: { label: Player, name: player, widget: string }

  - name: rankings
    label: "Rankings"
    files:
      - name: rankings
        label: "Rankings"
        file: src/content/rankings.json
        format: json
        fields:
          - {
              label: "Show as Preview Data",
              name: isPreview,
              widget: boolean,
              default: true,
            }
          - name: tables
            label: "Ranking tables (add one per category, e.g. Women's Open)"
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: "Table name", name: label, widget: string }
              - name: rows
                label: "Players in rank order"
                widget: list
                summary: "{{fields.rank}}. {{fields.name}}"
                fields:
                  - { label: Rank, name: rank, widget: string }
                  - { label: Player, name: name, widget: string }
                  - { label: Points, name: points, widget: string }

  - name: sponsors
    label: "Sponsors"
    files:
      - name: sponsors
        label: "Sponsors"
        file: src/content/sponsors.json
        format: json
        fields:
          - name: items
            label: "Sponsors (maximum 3, each needs a different Pin Position)"
            widget: list
            max: 3
            fields:
              - { label: Role, name: role, widget: string }
              - { label: Name, name: name, widget: string }
              - { label: Logo Image, name: image, widget: image }
              - name: cls
                label: "Pin Position"
                widget: select
                options: ["pin-a", "pin-b", "pin-c"]

  - name: contact
    label: "Contact"
    files:
      - name: contact
        label: "Contact Details"
        file: src/content/contact.json
        format: json
        fields:
          - {
              label: "Main email (also shown on Privacy, Terms and Cookies pages)",
              name: email,
              widget: string,
              required: false,
            }
          - name: people
            label: "Contact people"
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: Name, name: name, widget: string }
              - {
                  label: "Phone (10 digits, e.g. 99087 44544)",
                  name: phone,
                  widget: string,
                  required: false,
                }
              - {
                  label: "Email (optional)",
                  name: email,
                  widget: string,
                  required: false,
                }
